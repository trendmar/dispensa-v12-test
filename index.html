<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1f6f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dispensa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Dispensa</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#f6f5f1; --card:#fff; --ink:#1b1d1c; --mut:#6b706d; --line:#e4e2dc;
  --acc:#1f6f4a; --acc2:#e7f2ec; --warn:#b4540a; --warn2:#fdf0e3; --bad:#b3261e; --bad2:#fbe9e7;
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121413; --card:#1c1f1d; --ink:#ecefed; --mut:#9aa19d; --line:#2c302e;
  --acc:#4cc18a; --acc2:#1d3328; --warn:#f0a35c; --warn2:#3a2a1a; --bad:#f2827a; --bad2:#3a1f1d;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--safe-t) + 10px) 14px 8px}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:22px;margin:0;flex:1;letter-spacing:-.3px}
.sync{font-size:12px;color:var(--mut)}
.sync.err{color:var(--bad)}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.ibtn:active{background:var(--line)}
.search{margin-top:8px;width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px}

main{padding:4px 12px calc(110px + var(--safe-b))}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 8px 10px;margin-bottom:6px}
.row.zero{opacity:.55}
.thumb{width:42px;height:42px;border-radius:10px;flex:none;background:var(--acc2);color:var(--acc);display:grid;place-items:center;font-weight:700;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:12px;padding:1px 7px;border-radius:6px;background:var(--line);color:var(--ink)}
.tag.w{background:var(--warn2);color:var(--warn)}
.tag.b{background:var(--bad2);color:var(--bad)}
.tag.g{background:var(--acc2);color:var(--acc)}
.qty{display:flex;align-items:center;gap:2px;flex:none}
.qb{width:38px;height:38px;border-radius:10px;background:var(--bg);font-size:22px;font-weight:600;line-height:1}
.qb:active{background:var(--line)}
.qv{min-width:30px;text-align:center;font-weight:700;font-size:17px}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
.sec{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:14px 4px 6px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:6px 10px calc(6px + var(--safe-b))}
.tab{flex:1;padding:6px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab b{font-size:20px;font-weight:400}
.tab.on{color:var(--acc);font-weight:600}
.fab{width:64px;height:64px;border-radius:20px;background:var(--acc);color:#fff;font-size:28px;margin-top:-30px;box-shadow:0 6px 18px rgba(0,0,0,.2);flex:none}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-left:2px}

/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 16px calc(18px + var(--safe-b))}
.grab{height:30px;margin:-10px 0 0;display:grid;place-items:center;touch-action:none}
.grab::before{content:'';width:40px;height:5px;border-radius:9px;background:var(--line)}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sh-h h2{margin:0;font-size:19px;flex:1}
label{display:block;font-size:13px;color:var(--mut);margin:10px 2px 4px}
.in{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.in:focus{border-color:var(--acc)}
.in.miss{border-color:var(--warn);background:var(--warn2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--mut);margin:4px 2px 0}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.step button{width:44px;height:44px;font-size:22px}
.step input{flex:1;width:100%;text-align:center;border:0;background:none;font-weight:700;font-size:17px;outline:none}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--acc);color:#fff;font-weight:600;font-size:16px;margin-top:14px}
.btn.sec2{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.del{background:none;color:var(--bad);margin-top:6px}
details{margin-top:12px}
summary{color:var(--acc);font-size:14px;font-weight:600;padding:4px 2px}

.det-top{display:flex;gap:12px;align-items:center}
.det-top .thumb{width:72px;height:72px;font-size:26px;border-radius:14px}
.big{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0 6px}
.big .qb{width:64px;height:64px;font-size:30px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.big .qv{font-size:40px;min-width:70px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px}
.fact span{display:block;font-size:12px;color:var(--mut)}

/* scanner */
#scan{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column}
#scan .bar{padding:calc(var(--safe-t) + 10px) 12px 10px;display:flex;align-items:center;gap:8px}
.seg{flex:1;display:flex;background:#222;border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;color:#bbb;font-size:14px;font-weight:600}
.seg button.on{background:#fff;color:#000}
.seg button.on.out{background:#f2827a}
.seg button.on.inn{background:#4cc18a}
#reader{flex:1;width:100%;overflow:hidden}
#reader video{object-fit:cover}
#scan .foot{padding:10px 12px calc(14px + var(--safe-b));display:flex;gap:8px}
#scan .foot input{flex:1;padding:12px;border-radius:12px;border:0;background:#222;color:#fff;outline:none}
#scan .foot button{padding:0 16px;border-radius:12px;background:#333;color:#fff}
#scan .msg{text-align:center;font-size:16px;font-weight:700;color:#ccc;padding:6px 12px;min-height:30px}
#scan .msg.in{color:#4cc18a}
#scan .msg.out{color:#f2827a}
#scan .msg.warn{color:#f0a35c}
#scan .msg.dup{color:#9aa19d}
/* pannello Scadenza? (R1.9): nello scanner è assoluto sopra .foot, fuori dal flusso flex; altrove è #lotbar fisso */
#lotpanel,#lotbar{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#lotpanel{position:absolute;left:10px;right:10px;bottom:calc(84px + var(--safe-b));z-index:6}
#lotbar{position:fixed;left:10px;right:10px;bottom:calc(84px + var(--safe-b));z-index:45}
.lp-h{font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lp-h small{color:var(--mut);font-size:12px}
.lp-x{width:34px;height:34px;border-radius:10px;background:var(--bg);font-size:16px;color:var(--ink);flex:none}
.lp-r{display:flex;gap:6px;flex-wrap:wrap}
.lp-b{padding:9px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink)}
.lp-b:active{background:var(--line)}
.lp-row{display:flex;gap:8px;margin-top:8px;align-items:center}
.lp-date{flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.lp-ok{background:var(--acc);color:#fff;border-color:var(--acc)}
.lot{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px;margin-bottom:6px}
.lot-d{flex:1;font-size:15px}
.lot-edit{display:flex;gap:8px;margin:-2px 0 8px}
.lot-edit .in{flex:1;min-width:0}
.scan-sync{font-size:13px;color:#ccc;min-width:48px;text-align:right;white-space:nowrap}
#flash{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;display:grid;place-items:center;font-size:96px;font-weight:700;color:rgba(255,255,255,.95)}
#flash.go{animation:flashgo .35s ease-out}
#flash.in{background:rgba(76,193,138,.55)}
#flash.out{background:rgba(242,130,122,.55)}
#flash.warn{background:rgba(240,163,92,.55)}
#flash.dup{background:rgba(154,161,157,.55)}
#flash.in::after{content:'＋'}
#flash.out::after{content:'−'}
#flash.warn::after{content:'!'}
#flash.dup::after{content:'⟲'}
@keyframes flashgo{0%{opacity:1}100%{opacity:0}}
@keyframes flashfade{0%{opacity:1}100%{opacity:0}}
@keyframes plin{0%{background:var(--acc2)}100%{background:var(--card)}}
@keyframes plout{0%{background:var(--bad2)}100%{background:var(--card)}}
@keyframes qvjump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.row.pl-in{animation:plin .3s ease-out}
.row.pl-out{animation:plout .3s ease-out}
.row.pl-in .qv,.row.pl-out .qv,.qv.jump{animation:qvjump .3s ease-out}
@media (prefers-reduced-motion:reduce){
  #flash.go{animation:flashfade .25s linear}
  #flash.in{background:transparent;box-shadow:inset 0 0 0 10px #4cc18a}
  #flash.out{background:transparent;box-shadow:inset 0 0 0 10px #f2827a}
  #flash.warn{background:transparent;box-shadow:inset 0 0 0 10px #f0a35c}
  #flash.dup{background:transparent;box-shadow:inset 0 0 0 10px #9aa19d}
  #flash::after{content:''!important}
  .row.pl-in,.row.pl-out{animation:none;background:var(--acc2)}
  .row.pl-in .qv,.row.pl-out .qv,.qv.jump{animation:none}
}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));z-index:50;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15px;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.list-chk{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:6px}
.list-chk input{width:22px;height:22px;accent-color:var(--acc)}
.list-chk.done .name{text-decoration:line-through;opacity:.5}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup" class="hidden" style="padding:calc(var(--safe-t) + 30px) 20px 20px;max-width:520px;margin:auto">
  <h1 style="margin:0 0 6px">🥫 Dispensa</h1>
  <p style="color:var(--mut);margin-top:0">Prima configurazione (una volta per telefono).</p>
  <label>Il tuo nome</label>
  <input class="in" id="su-user" placeholder="Mario">
  <label>Link di configurazione <i>oppure</i> URL Apps Script</label>
  <textarea class="in" id="su-url" rows="3" placeholder="https://script.google.com/macros/s/…/exec"></textarea>
  <label>Token</label>
  <input class="in" id="su-token" placeholder="token segreto">
  <p class="hint">Se incolli il link di configurazione completo, URL e token si compilano da soli.</p>
  <button class="btn" id="su-go">Collega</button>
  <button class="btn sec2" id="su-local">Prova senza cloud (solo questo telefono)</button>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="top">
      <h1 id="title">Dispensa</h1>
      <span class="sync" id="sync"></span>
      <button class="ibtn" id="b-add" title="Aggiungi a mano">＋</button>
      <button class="ibtn" id="b-set" title="Impostazioni">⚙︎</button>
    </div>
    <div id="hdr-inv">
      <input class="search" id="q" type="search" placeholder="Cerca prodotto, marca, categoria…" autocomplete="off">
      <div class="chips" id="chips"></div>
    </div>
  </header>
  <main id="main"></main>
  <nav>
    <button class="tab on" data-tab="inv"><b>☰</b>Dispensa</button>
    <button class="fab" id="b-scan" aria-label="Scansiona">▥</button>
    <button class="tab" data-tab="shop"><b>🛒</b><span>Spesa<span id="shopN"></span></span></button>
  </nav>
</div>

<!-- SCANNER -->
<div id="scan" class="hidden">
  <div class="bar">
    <div class="seg" id="mode">
      <button data-m="out">− Usa</button>
      <button data-m="ask">Chiedi</button>
      <button data-m="in">+ Carica</button>
    </div>
    <span class="scan-sync" id="scan-sync"></span>
    <button class="ibtn" id="scan-x" style="color:#fff">✕</button>
  </div>
  <div id="reader"></div>
  <div id="flash"></div>
  <div class="msg" id="scan-msg" aria-live="polite">Inquadra il codice a barre</div>
  <div id="lotpanel" class="hidden"></div>
  <div class="foot">
    <input id="scan-man" inputmode="numeric" placeholder="…o digita il codice">
    <button id="scan-go">OK</button>
  </div>
</div>

<div id="sheet-root"></div>
<div id="lotbar" class="hidden"></div>
<div id="toast"></div>

<script>
/* ================= CONFIG / STATO ================= */
const VERSION = '1.2.0';
const LS = {cfg:'disp.cfg', items:'disp.items', extras:'disp.extras', pend:'disp.pend', mode:'disp.mode', srv:'disp.srv', lastExp:'disp.lastExp'};
const DEF_POS = ['Dispensa','Frigo','Freezer','Cantina'];
const DEF_CAT = ['Pasta e riso','Conserve','Sughi e condimenti','Colazione','Snack e dolci','Bevande',
  'Latticini','Carne e pesce','Frutta e verdura','Surgelati','Bimbi','Casa e pulizia','Altro'];
const SOON_DAYS = 7;

// BEGIN lots.js
/* Riferimento per la rev. 1.2: logica pura dei lotti, identica lato app e lato Code.gs.
   Lotto = { d: 'YYYY-MM-DD' | '', q: intero > 0 }. d vuoto = senza data. */

// Data valida solo se YYYY-MM-DD, altrimenti 'senza data'.
const isoOrEmpty = d => (/^\d{4}-\d{2}-\d{2}$/.test(String(d || '')) ? String(d) : '');
const cmp = (a, b) => (a.d === b.d ? 0 : a.d === '' ? 1 : b.d === '' ? -1 : a.d < b.d ? -1 : 1);
const sorted = lots => lots.slice().sort(cmp);
const total = lots => lots.reduce((s, l) => s + l.q, 0);

function parseLots(raw) {
  if (!raw) return [];
  try {
    const a = JSON.parse(raw);
    if (!Array.isArray(a)) return [];
    return a.filter(l => l && Number(l.q) > 0).map(l => ({ d: isoOrEmpty(l.d), q: Math.floor(Number(l.q)) }));
  } catch (e) { return []; }
}
const serializeLots = lots => (lots.length ? JSON.stringify(sorted(lots).map(l => ({ d: l.d, q: l.q }))) : '');

function addToLot(lots, d, n) {
  d = isoOrEmpty(d);
  const out = lots.map(l => ({ ...l }));
  const f = out.find(l => l.d === d);
  if (f) f.q += n; else out.push({ d, q: n });
  return sorted(out);
}
function consumeFefo(lots, n) {
  const out = []; const taken = []; let left = n;
  for (const l of sorted(lots)) {
    if (left <= 0) { out.push({ ...l }); continue; }
    const t = Math.min(l.q, left); left -= t; taken.push({ d: l.d, q: t });
    if (l.q > t) out.push({ d: l.d, q: l.q - t });
  }
  return { lots: out, taken };
}
// Consumo da un lotto preciso; se non basta (o non esiste) il resto va in FEFO. Il totale scalato è sempre n.
function consumeFromLot(lots, d, n) {
  d = isoOrEmpty(d);
  const f = lots.find(l => l.d === d);
  const t = Math.min(n, f ? f.q : 0);
  const rest = lots.map(l => (l.d === d ? { d: l.d, q: l.q - t } : { ...l })).filter(l => l.q > 0);
  const taken = t ? [{ d, q: t }] : [];
  if (n - t <= 0) return { lots: sorted(rest), taken };
  const r = consumeFefo(rest, n - t);
  return { lots: r.lots, taken: taken.concat(r.taken) };
}
function moveUnits(lots, from, to, n) {
  from = isoOrEmpty(from);
  const f = lots.find(l => l.d === from);
  const t = Math.min(n, f ? f.q : 0);
  if (!t) return lots.map(l => ({ ...l }));
  const rest = lots.map(l => (l.d === from ? { d: l.d, q: l.q - t } : { ...l })).filter(l => l.q > 0);
  return addToLot(rest, to, t);
}
function reconcile(lots, qty) {
  const s = total(lots);
  if (s < qty) return addToLot(lots, '', qty - s);
  if (s > qty) return consumeFefo(lots, s - qty).lots;
  return sorted(lots);
}
// Lotti effettivi di un prodotto tracciato. Non scrive nulla: lotti virtuale se la colonna è vuota.
function effectiveLots(item) {
  const own = parseLots(item.lotti);
  if (own.length) return reconcile(own, item.qty);
  return item.qty > 0 ? [{ d: item.scadenza || '', q: item.qty }] : [];
}
const nextExpiry = lots => (sorted(lots).find(l => l.d !== '') || { d: '' }).d;

// Operazione delta su prodotto tracciato. Restituisce una copia del prodotto con lotti, qty, scadenza coerenti.
function applyDelta(item, delta, lotDate) {
  let lots = effectiveLots(item); let taken = [];
  const qty = Math.max(0, item.qty + delta);
  if (delta > 0) lots = addToLot(lots, lotDate || '', delta);
  else if (delta < 0) {
    const n = Math.min(-delta, item.qty);
    const r = lotDate ? consumeFromLot(lots, lotDate, n) : consumeFefo(lots, n);
    lots = r.lots; taken = r.taken;
  }
  return { item: { ...item, qty, lotti: serializeLots(lots), scadenza: nextExpiry(lots) }, taken };
}
// END lots.js

const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch(e){ return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

let cfg = load(LS.cfg, null);
let items = load(LS.items, []);
let pending = load(LS.pend, []);
let extras = load(LS.extras, []);
let tab = 'inv', filter = 'all', query = '';
let syncing = false, syncErr = '', retryT = 0, scanOpen = false;
let srv = load(LS.srv, {version: '', config: null});   // ultima versione/config noti del backend
let lastExp = load(LS.lastExp, {});                     // id prodotto → ultima data scelta (max 200)
let lp = null, us = null, pickerUntil = 0;                         // pannello Scadenza? {id,n,host,sheet}; selettore data nativo aperto fino a…
const QUICK_DAYS = [7, 30], PICK_MS = 20000, LASTEXP_MAX = 200;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const positions = () => cfg?.pos?.length ? cfg.pos : DEF_POS;

/* ================= SETUP ================= */
function parseSetupLink(txt){
  // accetta: link app con #u=...&t=...  oppure URL /exec puro
  try {
    const h = txt.includes('#') ? txt.split('#')[1] : '';
    if (h) { const p = new URLSearchParams(h); if (p.get('u')) return {url:p.get('u'), token:p.get('t')||''}; }
  } catch(e){}
  return {url: txt.trim(), token: null};
}
function initSetup(){
  // link di configurazione aperto direttamente
  if (location.hash.includes('u=')) {

// fetch con timeout (Q2): senza risposta entro `ms` la richiesta viene annullata (AbortError)
async function fetchJson(url, opts, ms = 45000){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, Object.assign({}, opts, {signal: ctl.signal})); return await r.json(); }
  finally { clearTimeout(t); }
}
const apiGet = (c = cfg) => fetchJson(c.url + '?token=' + encodeURIComponent(c.token) + '&_=' + Date.now());
// text/plain evita il preflight CORS con Apps Script
const apiPost = ops => fetchJson(cfg.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({token: cfg.token, ops})});
// confronto di versioni per componenti numerici: '1.10' > '1.2', '1.2.0' = '1.2'
function cmpVersion(a, b){
  const x = String(a || '').split('.').map(Number), y = String(b || '').split('.').map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d < 0 ? -1 : 1; }
  return 0;
}
function noteSrv(r){ srv = {version: String(r.version || ''), config: r.config || null}; save(LS.srv, srv); }
function queue(op){
  op.user = cfg.user; op.opId = uid();   // opId: il backend scarta i rinvii di una richiesta persa (Q7)
  if (cfg.url) { pending.push(op); save(LS.pend, pending); }
  save(LS.items, items); save(LS.extras, extras);
  render();

}
async function sync(){
  clearTimeout(retryT);

  if (syncing) { sync.again = true; return; }
  syncing = true; updateSync();
  try {
    const batch = pending.slice();
    const r = batch.length ? await apiPost(batch) : await apiGet();
    if (!r.ok) throw new Error(r.error);
    pending = pending.slice(batch.length); save(LS.pend, pending);
    // con operazioni ancora in coda (es. un cfgSet) la config locale vale più di quella appena letta
    noteSrv(pending.length ? Object.assign({}, r, {config: srv.config || r.config}) : r);
    if (!pending.length) { items = r.items; extras = r.extras || []; save(LS.items, items); save(LS.extras, extras); }
    syncErr = '';

    syncErr = e.name === 'AbortError' ? 'timeout' : (e.message || 'offline');
  } finally { syncing = false; }
  updateSync(); render();
  if (syncErr && pending.length) retryT = setTimeout(() => { if (!document.hidden) sync(); }, 30000);

// ✓ tutto inviato · ⟳ in invio · · N in coda · ⚠︎ N errore · offline · N senza rete
function syncLabel({syncing, pending, err, online}){
  if (!online) return `offline · ${pending}`;
  if (syncing) return '⟳';

  return pending > 0 ? `· ${pending}` : '✓';
}
function updateSync(){
  const n = pending.length, online = navigator.onLine !== false;

  if (d === 0) return `<span class="tag b">scade oggi${x}</span>`;
  if (d <= SOON_DAYS) return `<span class="tag w">scade tra ${d} gg${x}</span>`;

// dd/mm non può essere confuso con lo stesso giorno di un altro anno, fuori sì (conserve, pasta con scadenze lunghe)
function fmtDM(d){

function openSheet(html, onMount){
  const root = $('#sheet-root');
  root.innerHTML = `<div class="ov"><div class="sheet"><div class="grab"></div>${html}</div></div>`;
  const ov = root.firstChild;
  ov.addEventListener('click', e => { if (e.target === ov) closeSheet(); });
  // la linguetta si trascina verso il basso: oltre 90 px chiude la scheda, altrimenti torna su
  const sh = ov.querySelector('.sheet'), gr = ov.querySelector('.grab'); let y0 = null, dy = 0;
  gr.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, {passive: true});
  gr.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, {passive: true});
  const end = () => { if (y0 === null) return; y0 = null; if (dy > 90) closeSheet(); else { sh.style.transition = 'transform .2s'; sh.style.transform = ''; } };
  gr.addEventListener('touchend', end); gr.addEventListener('touchcancel', end);
  onMount && onMount(ov);
}

/* ================= SCANNER ================= */
let qr = null, scanMode = load(LS.mode, 'out'), busy = false;
const rd = {code: '', seenAt: 0, at: 0};   // stato anti-doppia-lettura: ultimo codice, ultima callback, ultima operazione

// Doppia lettura (R2.2a): 'process' = opera; 'silent' = stesso codice ancora inquadrato; 'dup' = ripresentato
// dopo >= 700 ms di assenza ed entro 2,5 s dall'ultima operazione.
function decideRead(st, code, now){
  const gap = now - st.seenAt, same = code === st.code;
  st.code = code; st.seenAt = now;
  if (same && gap < 700) return 'silent';
  if (same && now - st.at < 2500) return 'dup';
  st.at = now; return 'process';
}
// Lettura confermata: il decoder può restituire, di rado, un EAN-13 con cifre sbagliate ma checksum valido (es. SMAC
// 8003650025968 letto 6005650085968). Un codice dalla fotocamera vale solo se decodificato due volte uguale di seguito
// entro CONFIRM_MS; un errore isolato viene scartato. La digitazione manuale passa direttamente da onCode().
const CONFIRM_MS = 1500, cf = {code: '', at: 0};
function confirmRead(st, code, now){
  const ok = st.code === code && now - st.at <= CONFIRM_MS;
  st.code = code; st.at = now; return ok;
}
function onScan(code){ code = String(code).trim(); if (code && confirmRead(cf, code, Date.now())) return onCode(code); }
function scanText(kind, nome, from, to, extra = ''){
  if (kind === 'dup') return 'Già letto, attendi un attimo';
  if (kind === 'warn') return `⚠︎ ${nome} · già a 0`;
  return `${kind === 'in' ? '＋' : '−'} ${nome} · ${from} → ${to}${extra}`;
}
// Flash a schermo intero: la classe si toglie e si rimette (reflow) così riparte pulito a ogni lettura
function flash(kind){
  const el = $('#flash'); el.className = ''; void el.offsetWidth; el.className = 'go ' + kind;
}

function setMode(m){
  scanMode = m; save(LS.mode, m);
  document.querySelectorAll('#mode button').forEach(b => {
    b.classList.toggle('on', b.dataset.m === m);
    b.classList.toggle('out', b.dataset.m === 'out'); b.classList.toggle('inn', b.dataset.m === 'in');
  });
  scanMsg({out:'Ogni scansione toglie 1', in:'Ogni scansione aggiunge 1', ask:'Inquadra il codice a barre'}[m]);
}
function scanMsg(t, kind = ''){ const m = $('#scan-msg'); m.textContent = t; m.className = ('msg ' + kind).trim(); }

async function openScanner(){
  scanOpen = true; rd.code = ''; cf.code = ''; updateSync();
  $('#scan').classList.remove('hidden'); setMode(scanMode); busy = false;
  if (typeof Html5Qrcode === 'undefined') { scanMsg('Scanner non caricato (offline?). Digita il codice.'); return; }
  try {
    const F = Html5QrcodeSupportedFormats;
    qr = new Html5Qrcode('reader', {verbose:false,
      formatsToSupport:[F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.QR_CODE],
      experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    const w = Math.min(window.innerWidth * .8, 320);
    await qr.start({facingMode:'environment'}, {fps:12, qrbox:{width:w, height:w*.5}, aspectRatio: window.innerHeight / window.innerWidth}, onScan, () => {});
  } catch(e) {
    scanMsg('Fotocamera non disponibile: ' + (e.message || e) + ' — digita il codice.');
  }
}
async function closeScanner(){
  try { if (qr && qr.isScanning) await qr.stop(); qr && qr.clear(); } catch(e){}
  qr = null; $('#scan').classList.add('hidden');
  if (lp && lp.host === 'panel') lotClose();
  if (us && us.host === 'panel') useClose();
  scanOpen = false; render();
}
function pauseScan(){ try { qr && qr.isScanning && qr.pause(true); } catch(e){} }
function resumeScan(){ busy = false; try { qr && qr.resume(); } catch(e){} }

function beep(ok = true){
  try {
    const a = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const o = a.createOscillator(), g = a.createGain();
    o.frequency.value = ok ? 1200 : 300; g.gain.value = .08;
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + (ok ? .08 : .2));
  } catch(e){}
  navigator.vibrate && navigator.vibrate(ok ? 40 : [60,40,60]);
}

async function onCode(code){
  code = String(code).trim();
  if (!code || busy || pickerOpen()) return;   // mentre il selettore data nativo è aperto le letture si ignorano
  const read = decideRead(rd, code, Date.now());
  if (read === 'silent') return;
  // conferma visiva prima di qualsiasi await (≤ 50 ms)
  if (read === 'dup') { flash('dup'); beep(false); scanMsg(scanText('dup'), 'dup'); return; }
  const it = byCode(code); useClose();

  if (it && scanMode !== 'ask') {
    const d = scanMode === 'in' ? 1 : -1, kind = d > 0 ? 'in' : 'out', from = it.qty;
    if (d < 0 && from <= 0) { flash('warn'); beep(false); scanMsg(scanText('warn', it.nome), 'warn'); return; }
    flash(kind);
    if (d > 0) { plusOne(it.id); beep(); scanMsg(scanText(kind, it.nome, from, it.qty, isTracked(it) ? ' · scegli la scadenza' : ''), kind); return; }
    const tr = isTracked(it); minusOne(it.id); beep();
    let x = '';
    if (tr) {   // R1.10: data del lotto consumato e, se diverso, il prossimo
      const t = changeQty.taken[0], nx = sorted(effectiveLots(it))[0];
      if (t) x += t.d ? ` · scade ${fmtDM(t.d)}` : ' · senza data';
      if (nx && nx.d && (!t || nx.d !== t.d)) x += ` · poi ${fmtDM(nx.d)}`;
    }
    scanMsg(scanText(kind, it.nome, from, it.qty, x + (inSpesa(it) ? ' · in lista spesa' : '')), kind);
    return;
  }

  lotClose(); busy = true; pauseScan(); beep();
  if (it) { closeSheet.after = resumeScan; openDetail(it.id); return; }

  // prodotto nuovo → Open Food Facts
  scanMsg('Nuovo codice, cerco il prodotto…');
  const pre = await offLookup(code);
  pre.barcode = code;
  pre.qty = scanMode === 'out' ? 0 : 1;
  closeSheet.after = resumeScan;
  openForm(null, pre);
}

async function offLookup(code){
  const base = {offMsg: 'Prodotto non trovato su Open Food Facts: inseriscilo una volta, poi verrà riconosciuto.'};
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name_it,product_name,generic_name_it,brands,quantity,image_front_small_url,categories_tags`, {signal: ctl.signal});
    clearTimeout(t);
    const j = await r.json();
    if (j.status !== 1 || !j.product) return base;
    const p = j.product;
    const nome = (p.product_name_it || p.product_name || p.generic_name_it || '').trim();
    const tags = (p.categories_tags || []).join(' ');
    const cat = guessCat(tags);
    return {nome, marca: (p.brands || '').split(',')[0].trim(), formato: (p.quantity || '').trim(),
      img: p.image_front_small_url || '', categoria: cat, posizione: guessPos(tags, cat),
      offMsg: nome ? 'Dati da Open Food Facts: controlla e completa.' : base.offMsg};
  } catch(e) { return {offMsg: 'Ricerca online non riuscita: inserisci i dati a mano.'}; }
}
function guessCat(t){
  const m = [
    [/frozen|surgel/, 'Surgelati'], [/baby|infant/, 'Bimbi'],
    [/pasta|rice|riz|cereal-grains|flours|legumes/, 'Pasta e riso'],
    [/sauces|condiment|oils|vinegar|spices|salts/, 'Sughi e condimenti'],
    [/breakfast|biscuit|cookies|rusks|jams|spreads|honey|coffee|teas/, 'Colazione'],
    [/snack|chocolate|sweets|candies|confection|chips|crisps|desserts/, 'Snack e dolci'],
    [/beverage|drinks|waters|juices|wines|beers|sodas/, 'Bevande'],
    [/dair|cheese|yogurt|milk|butter|cream/, 'Latticini'],
    [/meat|fish|seafood|sausage|ham|tuna/, 'Carne e pesce'],
    [/canned|preserves|conserve/, 'Conserve'],
    [/fruit|vegetable|plant-based-foods(?!-and)/, 'Frutta e verdura'],
  ];
  for (const [re, c] of m) if (re.test(t)) return c;
  return 'Altro';
}
function guessPos(t, cat){
  const p = positions();
  if (cat === 'Surgelati' && p.includes('Freezer')) return 'Freezer';
  if (/fresh|yogurt|cheeses|milk(?!-powder)|butter|cream|ham|sausage/.test(t) && !/uht|long-life|canned/.test(t) && p.includes('Frigo')) return 'Frigo';
  return p[0];
}

/* ================= UTIL ================= */
function toast(t){
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200);
}
async function shareText(title, text){
  if (navigator.share) { try { await navigator.share({title, text}); return; } catch(e){ if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text); toast('Copiato negli appunti'); } catch(e){ prompt('Copia:', text); }
}
function exportCsv(){
  const cols = ['nome','marca','formato','categoria','posizione','qty','scortaMin','scadenza','barcode','note','lotti'];
  const csv = [cols.join(';')].concat(items.map(i => cols.map(c => `"${String(i[c] ?? '').replace(/"/g,'""')}"`).join(';'))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type:'text/csv'}));
  a.download = 'dispensa-' + new Date().toISOString().slice(0,10) + '.csv'; a.click();
}

/* ================= EVENTI ================= */
function start(){
  $('#setup').classList.add('hidden'); $('#app').classList.remove('hidden');
  if (!cfg.pos) cfg.pos = DEF_POS;
  render(); sync();
}
document.addEventListener('click', e => {
  const t = e.target;
  const qb = t.closest('.row .qb');
  if (qb) { const it = +qb.dataset.d > 0 ? plusOne(qb.dataset.id) : minusOne(qb.dataset.id); if (it && inSpesa(it) && +qb.dataset.d < 0 && it.qty === it.scortaMin - 1) toast(`${it.nome} → lista spesa`); return; }
  const op = t.closest('[data-open]'); if (op) return openDetail(op.dataset.open);
  const th = t.closest('.row .thumb'); if (th) return openDetail(th.parentElement.dataset.id);
  const ch = t.closest('#chips .chip'); if (ch) { filter = ch.dataset.f; render(); window.scrollTo(0,0); return; }
  const tb = t.closest('.tab'); if (tb) { tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (t.closest('#share')) {
    const righe = items.filter(inSpesa).map(i => `• ${i.nome}${i.marca ? ' (' + i.marca + ')' : ''}${isLow(i) ? ' ×' + (i.scortaMin - i.qty) : ''}`)
      .concat(extras.filter(x => x.stato !== 'preso').map(x => `• ${x.nome}`));
    return shareText('Lista spesa', '🛒 Lista spesa\n' + righe.join('\n'));
  }
  if (t.closest('#x-add')) return addExtra();
  if (t.closest('#x-clear')) {
    const ids = extras.filter(x => x.stato === 'preso').map(x => x.id);
    extras = extras.filter(x => x.stato !== 'preso'); queue({op:'extraDel', id: ids}); return;
  }
});
document.addEventListener('change', e => {
  const tk = e.target.dataset?.tick, xt = e.target.dataset?.xtick;
  if (tk) { const it = byId(tk); setStato(tk, e.target.checked ? 'preso' : (isLow(it) ? '' : 'comprare')); }
  if (xt) { const x = extras.find(x => x.id === xt); if (x) { x.stato = e.target.checked ? 'preso' : ''; queue({op:'extraSet', id: xt, stato: x.stato}); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'x-new') addExtra(); });
$('#q').addEventListener('input', e => { query = e.target.value.trim(); renderInv(); });
$('#b-scan').onclick = openScanner;
$('#b-add').onclick = () => openForm(null);
$('#b-set').onclick = openSettings;
$('#scan-x').onclick = closeScanner;
$('#mode').onclick = e => { const b = e.target.closest('[data-m]'); if (b) setMode(b.dataset.m); };
$('#scan-go').onclick = () => { const v = $('#scan-man').value.trim(); if (v) { $('#scan-man').value = ''; rd.code = ''; onCode(v); } };
$('#scan-man').addEventListener('keydown', e => { if (e.key === 'Enter') $('#scan-go').click(); });
// il form aperto dallo scanner deve stare sopra lo scanner
new MutationObserver(() => { $('#sheet-root').style.cssText = $('#sheet-root').innerHTML ? 'position:relative;z-index:40' : ''; })
  .observe($('#sheet-root'), {childList:true});
document.addEventListener('visibilitychange', () => { if (!document.hidden && cfg) sync(); });
window.addEventListener('online', () => { updateSync(); cfg && sync(); });
window.addEventListener('offline', updateSync);

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (cfg) start(); else initSetup();
</script>
